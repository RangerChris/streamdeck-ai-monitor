<!doctype html>
<html>
	<head lang="en">
		<title>Tree Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Tree type">
			<sdpi-select setting="species">
				<option value="">— plant me —</option>
				<option value="bonsai">Bonsai</option>
				<option value="cherry">Cherry</option>
				<option value="birch">Birch</option>
				<option value="oak">Oak</option>
				<option value="redwood">Redwood</option>
				<option value="custom">Custom</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Trunk">
			<sdpi-color setting="customTrunk" showalpha="false"></sdpi-color>
		</sdpi-item>
		<sdpi-item label="Canopy">
			<sdpi-color setting="customCanopy" showalpha="false"></sdpi-color>
		</sdpi-item>
		<sdpi-item label="Accent">
			<sdpi-color setting="customAccent" showalpha="false"></sdpi-color>
		</sdpi-item>
		<sdpi-item label="Custom max tokens">
			<sdpi-textfield setting="customCost" placeholder="200000"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Reset next press">
			<sdpi-checkbox setting="resetOnPress"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Test tokens">
			<sdpi-textfield setting="testBatch" placeholder="off"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Notes">
			<p style="font-size: 10px; margin-top: 8px">
				Press the key to mark it as the grower. With <b>Test tokens</b> set, a press also adds that many tokens. Colors and <b>Custom max tokens</b> apply to <b>Custom</b>.
			</p>
		</sdpi-item>
	</body>
</html>
